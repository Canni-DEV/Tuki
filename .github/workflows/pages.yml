name: Verificar y publicar Tuki
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: Commit de main verificado por npm run publish:verified
        required: true
        type: string
      certificado:
        description: Constancia completa Windows generada por el comando de publicación
        required: true
        type: string

jobs:
  verificar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      REPO_NAME: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run render:typecheck
      - run: node art/verify_models.mjs
      - run: npm run test:run
      - run: npm run build -- --base="/$REPO_NAME/"
      - name: Exigir la revisión y compilación verificadas en Windows
        if: github.event_name == 'workflow_dispatch'
        env:
          REVISION_VERIFICADA: ${{ inputs.revision }}
          CERTIFICADO: ${{ inputs.certificado }}
        run: |
          node --input-type=module <<'JS'
          import { comprobarDist } from './qa/certificado-publicacion.mjs'
          if (process.env.GITHUB_REF !== 'refs/heads/main' || process.env.REVISION_VERIFICADA !== process.env.GITHUB_SHA) throw new Error('Solo se publica el commit exacto de main que fue verificado.')
          await comprobarDist(JSON.parse(process.env.CERTIFICADO), process.env.GITHUB_SHA, 'dist')
          JS
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        with:
          path: dist
  publicar:
    needs: verificar
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
