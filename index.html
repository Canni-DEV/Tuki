<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6eedc">
  <style>html{background:#faf6ea}html[data-apariencia="oscuro"]{background:#111d1b;color-scheme:dark}</style>
  <script>
    // Resolve the saved appearance before CSS, fonts and the 3D scene arrive.
    try {
      const apariencia = JSON.parse(localStorage.getItem('__TUKI_APARIENCIA__') || 'null');
      const oscuro = apariencia === 'oscuro' || (apariencia === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.apariencia = oscuro ? 'oscuro' : 'claro';
      if (oscuro) document.querySelector('meta[name="theme-color"]').content = '#111d1b';
    } catch { /* Storage may be unavailable; keep the original light appearance. */ }
  </script>
  <meta name="description" content="Armá un recorrido de dominós en 3D sobre una mesa de cocina y probalo con un solo empujón.">
  <link rel="icon" type="image/svg+xml" href="./docs/arte/marca/simbolo.svg">
  <title>Tuki · Dominós en cadena</title>
</head>
<body><main id="app"></main><dialog id="dialog"></dialog><div id="aviso" role="status"></div><script type="module" src="./src/main.ts"></script></body>
</html>
